
font=Andy:size=14
letter-spacing=-3
line-height=22px
pad=15x15

[tweak]
font-monospace-warn=no

[colors-dark]
alpha=0.7

foreground=FAFAFA
background=3B4A8E

cursor=3B4A8E FAE3B0

selection-foreground=FAE3B0
selection-background=2D3560

regular0=1E1E1E   # black
regular1=BAA723   # red
regular2=CCC723   # green (primary)
regular3=E7CE69   # yellow
regular4=5D74D6   # blue
regular5=CCC723
regular6=4661D2   # cyan
regular7=FAE3B0   # white

bright0=7D8593    # bright black
bright1=E37886    # bright red
bright2=E0DB45    # bright green
bright3=F4DE89    # bright yellow
bright4=7D92F0    # bright blue
bright5=A68BF2    # bright magenta
bright6=7EE2E5    # bright cyan
bright7=FAFAFA    # bright white

[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

[scrollback]
lines=100000

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste


[search-bindings]
cancel=Control+g Control+Shift+c Escape

[url-bindings]
cancel=Control+g Control+Shift+c Control+d Escape


[cursor]
blink=yes
blink-rate=1000

[main]
